<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monsnode Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0b0b; color: #eee; padding: 16px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #888; margin-bottom: 18px; font-size: 0.9rem; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    input { flex: 1; min-width: 160px; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: white; }
    button { padding: 12px 16px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    button.secondary { background: #333; }
    #status { margin-bottom: 14px; padding: 10px 14px; border-radius: 8px; background: #1a1a1a; display: none; font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { background: #161616; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #2a2a2a; }
    .card:hover { border-color: #3b82f6; transform: translateY(-2px); }
    .card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: #111; }
    .card .label { padding: 8px; font-size: 0.75rem; color: #aaa; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.93); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { position: relative; width: 100%; max-width: 420px; background: #111; border-radius: 14px; overflow: hidden; }
    .modal video { width: 100%; max-height: 80vh; background: #000; display: block; }
    .modal-close { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; z-index: 10; }
    .modal-info { padding: 12px; font-size: 0.85rem; }
    .modal-info a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monsnode Player</h1>
    <p class="subtitle">Klik thumbnail untuk play video</p>

    <div class="controls">
      <button id="btnRandom">Random</button>
      <input type="text" id="keyword" value="japanese" placeholder="Cari..." />
      <button id="btnSearch">Search</button>
      <button class="secondary" id="btnClear">Clear</button>
    </div>

    <div id="status"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="btnClose">×</button>
      <video id="player" controls autoplay playsinline></video>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </div>

  <script>
    // ====================== GANTI INI ======================
    const WORKER_URL = "https://tetes.kimrosekim69.workers.dev";
    // =======================================================

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.style.background = isError ? "#3f1515" : "#1a1a1a";
      el.style.color = isError ? "#fca5a5" : "#ddd";
      el.textContent = msg;
    }

    function clearAll() {
      document.getElementById("grid").innerHTML = "";
      document.getElementById("status").style.display = "none";
      closeModal();
    }

    async function loadRandom() {
      const btn = document.getElementById("btnRandom");
      btn.disabled = true;
      setStatus("Mengambil random...");

      try {
        const res = await fetch(WORKER_URL + "/random");
        const json = await res.json();
        if (json.status !== "success") throw new Error(json.message || "Gagal");
        renderGrid(json.data);
        setStatus(`Berhasil load ${json.data.length} video`);
      } catch (err) {
        setStatus("Error: " + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadSearch() {
      const keyword = document.getElementById("keyword").value.trim();
      if (!keyword) return alert("Masukkan kata kunci");

      const btn = document.getElementById("btnSearch");
      btn.disabled = true;
      setStatus(`Mencari "${keyword}"...`);

      try {
        const res = await fetch(WORKER_URL + "/search?q=" + encodeURIComponent(keyword));
        const json = await res.json();
        if (json.status !== "success") throw new Error(json.message || "Gagal");
        renderGrid(json.data);
        setStatus(`Ditemukan ${json.data.length} hasil`);
      } catch (err) {
        setStatus("Error: " + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.video_image}" loading="lazy" alt="">
          <div class="label">Klik untuk play</div>
        `;
        card.onclick = () => playVideo(item);
        grid.appendChild(card);
      });
    }

async function playVideo(item) {
  setStatus("Mengambil link video...");
  try {
    const res = await fetch(WORKER_URL + "/video?url=" + encodeURIComponent(item.detail_url));
    const json = await res.json();

    if (json.status !== "success") throw new Error(json.message || "Gagal");

    const player = document.getElementById("player");
    player.src = json.video_url;   // langsung Direct
    player.load();
    player.play().catch(() => {});

    document.getElementById("modalInfo").innerHTML = 
      (json.tweet_url ? `<a href="${json.tweet_url}" target="_blank">Tweet Asli</a> · ` : "") +
      `<a href="${json.video_url}" target="_blank">Link Asli</a>`;

    document.getElementById("modal").classList.add("active");
    setStatus("Video siap (Direct)");
  } catch (err) {
    setStatus("Gagal: " + err.message, true);
    console.error(err);
  }
}

    function closeModal() {
      const player = document.getElementById("player");
      player.pause();
      player.removeAttribute("src");
      document.getElementById("modal").classList.remove("active");
    }

    document.getElementById("btnRandom").onclick = loadRandom;
    document.getElementById("btnSearch").onclick = loadSearch;
    document.getElementById("btnClear").onclick = clearAll;
    document.getElementById("btnClose").onclick = closeModal;
    document.getElementById("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };

    // Auto load
    loadRandom();
  </script>
</body>
</html>
