<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>MonsPlay</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #161616;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 90px;
    }

    /* ===== GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      padding: 12px;
    }
    .card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 9/16;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .card-overlay .username {
      flex: 1;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      color: #fff;
    }
    .card-overlay button {
      background: none;
      border: none;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
    .card-overlay button.saved { color: #22c55e; }

    /* ===== SKELETON ===== */
    .skeleton {
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
      aspect-ratio: 9/16;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .bottom-nav button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 58px;
    }
    .bottom-nav button.active {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }
    .bottom-nav i { font-size: 1.15rem; }

    /* ===== TRENDING FILTER ===== */
    .filters {
      display: none;
      justify-content: center;
      gap: 8px;
      padding: 12px 12px 0;
    }
    .filters.show { display: flex; }
    .filters button {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filters button.active {
      background: #333;
      color: white;
    }

    /* ===== PLAYER VIEW ===== */
    #player-view {
      display: none;
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    #player-view.active { display: block; }
    #main-view.hidden { display: none; }

    .player-wrapper {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .player-wrapper video {
      width: 100%;
      max-height: 70vh;
      display: block;
    }
    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .action-row button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .back-btn {
      margin-bottom: 12px;
      background: none;
      border: 1px solid #333;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .related-title {
      font-size: 1rem;
      color: #888;
      margin-bottom: 10px;
    }

    /* Search overlay simple */
    .search-bar {
      display: none;
      padding: 12px;
    }
    .search-bar.show { display: block; }
    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: white;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="main-view">
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Search..." onkeydown="if(event.key==='Enter')doSearch()">
    </div>

    <div class="filters" id="trendingFilters">
      <button class="filter-btn active" data-period="24h">Today</button>
      <button class="filter-btn" data-period="3d">3 Day</button>
      <button class="filter-btn" data-period="7d">Week</button>
    </div>

    <div class="grid" id="grid"></div>
    <div style="text-align:center; padding: 20px;">
      <button onclick="loadMore()" id="loadMoreBtn" style="padding:12px 28px; border-radius:30px; border:none; background:#222; color:white; font-weight:600;">Load More</button>
    </div>
  </div>

  <!-- PLAYER VIEW -->
  <div id="player-view">
    <button class="back-btn" onclick="closePlayer()">← Back</button>
    <div class="player-wrapper">
      <video id="player" controls playsinline></video>
    </div>
    <div class="action-row">
      <button id="btnDownload">Download</button>
      <button id="btnShare">Share</button>
    </div>
    <div class="related-title">Related from this user</div>
    <div class="grid" id="relatedGrid"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="home"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button class="nav-btn" data-page="trending"><i class="fa-solid fa-fire"></i><span>Trending</span></button>
    <button class="nav-btn" data-page="surprise"><i class="fa-solid fa-shuffle"></i><span>Surprise</span></button>
    <button class="nav-btn" data-page="search"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button>
    <button class="nav-btn" data-page="saved"><i class="fa-solid fa-bookmark"></i><span>Saved</span></button>
  </nav>

  <script>
    const WORKER_URL = "https://tetes.kimrosekim69.workers.dev"; // ganti jika perlu

    let currentPage = "home";
    let currentPeriod = "24h";
    let currentItems = [];
    let pageNum = 1;

    // ===== NAV =====
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPage = btn.dataset.page;
        pageNum = 1;
        currentItems = [];

        document.getElementById("trendingFilters").classList.toggle("show", currentPage === "trending");
        document.getElementById("searchBar").classList.toggle("show", currentPage === "search");

        closePlayer();
        loadContent();
      });
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPeriod = btn.dataset.period;
        pageNum = 1;
        currentItems = [];
        loadContent();
      });
    });

    // ===== LOAD =====
    async function loadContent(append = false) {
      const grid = document.getElementById("grid");
      if (!append) {
        grid.innerHTML = "";
        // skeleton
        for (let i = 0; i < 12; i++) {
          const sk = document.createElement("div");
          sk.className = "skeleton";
          grid.appendChild(sk);
        }
      }

      try {
        let url = "";
        if (currentPage === "home") url = `${WORKER_URL}/home?page=${pageNum}`;
        else if (currentPage === "trending") url = `${WORKER_URL}/trending?period=${currentPeriod}`;
        else if (currentPage === "surprise") url = `${WORKER_URL}/random`;
        else if (currentPage === "search") {
          const q = document.getElementById("searchInput").value.trim();
          if (!q) return;
          url = `${WORKER_URL}/search?q=${encodeURIComponent(q)}`;
        }
        else if (currentPage === "saved") {
          const saved = getSaved();
          renderGrid(saved, false);
          return;
        }

        const res = await fetch(url);
        const json = await res.json();
        if (json.status !== "success") throw new Error("Gagal load");

        if (append) currentItems = currentItems.concat(json.data);
        else currentItems = json.data;

        renderGrid(currentItems, append);
      } catch (err) {
        console.error(err);
        if (!append) grid.innerHTML = "";
      }
    }

    function loadMore() {
      pageNum++;
      loadContent(true);
    }

    function doSearch() {
      currentPage = "search";
      pageNum = 1;
      loadContent();
    }

    // ===== RENDER CARD =====
    function renderGrid(items, append = false) {
      const grid = document.getElementById("grid");
      if (!append) grid.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const isSaved = getSaved().some(v => v.detail_url === item.detail_url);

        card.innerHTML = `
          <img src="${item.video_image}" loading="lazy" alt="">
          <div class="card-overlay">
            <button class="like-btn ${isSaved ? 'saved' : ''}" data-url="${item.detail_url}">
              <i class="fa-${isSaved ? 'solid' : 'regular'} fa-thumbs-up"></i>
            </button>
            <div class="username">${item.username || 'user'}</div>
            <button class="dislike-btn">
              <i class="fa-regular fa-thumbs-down"></i>
            </button>
          </div>
        `;

        // klik thumbnail → play
        card.querySelector("img").onclick = () => openPlayer(item);

        // username → related user
        card.querySelector(".username").onclick = (e) => {
          e.stopPropagation();
          loadUser(item.user_id);
        };

        // like
        card.querySelector(".like-btn").onclick = (e) => {
          e.stopPropagation();
          toggleSave(item, e.currentTarget);
        };

        // dislike
        card.querySelector(".dislike-btn").onclick = (e) => {
          e.stopPropagation();
          removeSave(item);
          e.currentTarget.closest(".card").querySelector(".like-btn").classList.remove("saved");
          e.currentTarget.closest(".card").querySelector(".like-btn i").className = "fa-regular fa-thumbs-up";
        };

        grid.appendChild(card);
      });
    }

    // ===== SAVED =====
    function getSaved() {
      return JSON.parse(localStorage.getItem("mons_saved") || "[]");
    }
    function saveList(list) {
      localStorage.setItem("mons_saved", JSON.stringify(list));
    }
    function toggleSave(item, btn) {
      let list = getSaved();
      const idx = list.findIndex(v => v.detail_url === item.detail_url);
      if (idx >= 0) {
        list.splice(idx, 1);
        btn.classList.remove("saved");
        btn.innerHTML = '<i class="fa-regular fa-thumbs-up"></i>';
      } else {
        list.unshift(item);
        btn.classList.add("saved");
        btn.innerHTML = '<i class="fa-solid fa-thumbs-up"></i>';
      }
      saveList(list);
    }
    function removeSave(item) {
      let list = getSaved().filter(v => v.detail_url !== item.detail_url);
      saveList(list);
    }

    // ===== PLAYER =====
    async function openPlayer(item) {
      try {
        const res = await fetch(WORKER_URL + "/video?url=" + encodeURIComponent(item.detail_url));
        const json = await res.json();
        if (json.status !== "success") throw new Error("Gagal");

        const player = document.getElementById("player");
        player.src = json.video_url;
        player.load();
        player.play().catch(()=>{});

        document.getElementById("btnDownload").onclick = () => window.open(json.video_url, "_blank");
        document.getElementById("btnShare").onclick = () => {
          if (navigator.share) navigator.share({ url: json.video_url });
          else {
            navigator.clipboard.writeText(json.video_url);
            alert("Link disalin");
          }
        };

        // related dari user
        loadRelated(item.user_id);

        document.getElementById("main-view").classList.add("hidden");
        document.getElementById("player-view").classList.add("active");
        window.scrollTo(0,0);
      } catch (err) {
        console.error(err);
      }
    }

    async function loadRelated(userId) {
      const grid = document.getElementById("relatedGrid");
      grid.innerHTML = "";
      try {
        const res = await fetch(WORKER_URL + "/user?id=" + userId);
        const json = await res.json();
        if (json.status === "success") {
          json.data.slice(0, 12).forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<img src="${item.video_image}" loading="lazy">`;
            card.onclick = () => openPlayer(item);
            grid.appendChild(card);
          });
        }
      } catch (e) {}
    }

    async function loadUser(userId) {
      currentPage = "user";
      pageNum = 1;
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (let i=0;i<8;i++) {
        const sk = document.createElement("div");
        sk.className = "skeleton";
        grid.appendChild(sk);
      }
      try {
        const res = await fetch(WORKER_URL + "/user?id=" + userId);
        const json = await res.json();
        currentItems = json.data || [];
        renderGrid(currentItems);
      } catch(e) {}
    }

    function closePlayer() {
      const player = document.getElementById("player");
      player.pause();
      player.removeAttribute("src");
      document.getElementById("player-view").classList.remove("active");
      document.getElementById("main-view").classList.remove("hidden");
    }

    // init
    loadContent();
  </script>
</body>
</html>
