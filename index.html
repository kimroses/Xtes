<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonsPlay</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161616;
      --border: #2a2a2a;
      --primary: #3b82f6;
      --text: #eee;
      --muted: #999;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11,11,11,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      white-space: nowrap;
    }
    .search-box {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: white;
      font-size: 0.95rem;
    }
    .search-box button, .icon-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn { background: #222; }

    /* Navigation */
    nav {
      display: flex;
      gap: 6px;
      max-width: 1200px;
      margin: 12px auto 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    nav button {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      font-size: 0.9rem;
    }
    nav button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Filter Trending */
    .filters {
      display: none;
      gap: 8px;
      max-width: 1200px;
      margin: 12px auto 0;
      padding: 0 16px;
    }
    .filters.show { display: flex; }
    .filters button {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #1a1a1a;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filters button.active {
      background: #333;
      color: white;
      border-color: #555;
    }

    /* Main Content */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    #status {
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #1a1a1a;
      display: none;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: 0.15s;
    }
    .card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .card img {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .load-more {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 24px auto;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #222;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .load-more:disabled { opacity: 0.5; }

    /* ================= PLAYER VIEW ================= */
    #player-view {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }
    #player-view.active { display: block; }
    #grid-view.hidden { display: none; }

    .player-wrapper {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .player-wrapper video {
      width: 100%;
      max-height: 70vh;
      display: block;
      background: #000;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .action-buttons button {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .action-buttons button.primary { background: var(--primary); }
    .action-buttons button.saved { background: #16a34a; }

    .related-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .back-btn {
      margin-bottom: 16px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="logo">MonsPlay</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search videos..." />
        <button onclick="doSearch()">Search</button>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" data-page="home">Home</button>
      <button class="nav-btn" data-page="trending">Trending</button>
      <button class="nav-btn" data-page="surprise">Surprise Me</button>
      <button class="nav-btn" data-page="saved">Saved</button>
    </nav>

    <div class="filters" id="trendingFilters">
      <button class="filter-btn active" data-period="24h">Today</button>
      <button class="filter-btn" data-period="3d">3 Day</button>
      <button class="filter-btn" data-period="7d">Week</button>
    </div>
  </header>

  <!-- STATUS -->
  <div id="status" style="max-width:1200px; margin:12px auto; padding:0 16px;"></div>

  <!-- GRID VIEW -->
  <main id="grid-view">
    <div class="grid" id="grid"></div>
    <button class="load-more" id="loadMoreBtn" onclick="loadMore()">Load More</button>
  </main>

  <!-- PLAYER VIEW -->
  <div id="player-view">
    <button class="back-btn" onclick="closePlayer()">← Back</button>

    <div class="player-wrapper">
      <video id="player" controls playsinline></video>
    </div>

    <div class="action-buttons">
      <button class="primary" id="btnDownload">Download</button>
      <button id="btnSaved">Saved</button>
      <button id="btnShare">Share</button>
    </div>

    <div class="related-title">Related Videos</div>
    <div class="grid" id="relatedGrid"></div>
  </div>

  <script>
    // ================= CONFIG =================
    const WORKER_URL = "https://tetes.kimrosekim69.workers.dev";   // GANTI jika perlu

    // ================= STATE =================
    let currentPage = "home";
    let currentPeriod = "24h";
    let currentKeyword = "";
    let pageNum = 1;
    let currentItems = [];
    let currentPlaying = null;

    // ================= HELPERS =================
    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.style.background = isError ? "#3f1515" : "#1a1a1a";
      el.style.color = isError ? "#fca5a5" : "#ddd";
      el.textContent = msg;
    }

    function hideStatus() {
      document.getElementById("status").style.display = "none";
    }

    function getSaved() {
      return JSON.parse(localStorage.getItem("mons_saved") || "[]");
    }

    function saveToStorage(items) {
      localStorage.setItem("mons_saved", JSON.stringify(items));
    }

    // ================= NAVIGATION =================
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPage = btn.dataset.page;
        pageNum = 1;
        currentItems = [];

        // Tampilkan filter hanya di Trending
        document.getElementById("trendingFilters").classList.toggle("show", currentPage === "trending");

        closePlayer();
        loadContent();
      });
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPeriod = btn.dataset.period;
        pageNum = 1;
        currentItems = [];
        loadContent();
      });
    });

    // ================= LOAD CONTENT =================
    async function loadContent(isLoadMore = false) {
      if (!isLoadMore) {
        document.getElementById("grid").innerHTML = "";
        setStatus("Loading...");
      }

      const btn = document.getElementById("loadMoreBtn");
      btn.disabled = true;

      try {
        let items = [];

        if (currentPage === "saved") {
          items = getSaved();
          renderGrid(items, false);
          setStatus(`Saved: ${items.length} videos`);
          btn.style.display = "none";
          return;
        }

        if (currentPage === "surprise") {
          const res = await fetch(WORKER_URL + "/random");
          const json = await res.json();
          if (json.status !== "success") throw new Error(json.message);
          items = json.data;
          pageNum = 1;
        } 
        else if (currentPage === "trending") {
          // Kita pakai endpoint search dulu sambil menyesuaikan Worker nanti
          // Sementara pakai ranking lewat parameter
          const res = await fetch(WORKER_URL + "/random"); // temporary
          // Nanti kita tambahkan support ranking di Worker
          const json = await res.json();
          items = json.data || [];
        }
        else if (currentPage === "home") {
          const res = await fetch(WORKER_URL + "/random");
          const json = await res.json();
          items = json.data || [];
        }
        else if (currentPage === "search") {
          const res = await fetch(WORKER_URL + "/search?q=" + encodeURIComponent(currentKeyword));
          const json = await res.json();
          items = json.data || [];
        }

        if (isLoadMore) {
          currentItems = currentItems.concat(items);
        } else {
          currentItems = items;
        }

        renderGrid(currentItems, isLoadMore);
        setStatus(`Showing ${currentItems.length} videos`);
        btn.style.display = "block";
      } catch (err) {
        setStatus("Error: " + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    function loadMore() {
      pageNum++;
      loadContent(true);
    }

    function doSearch() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;
      currentKeyword = q;
      currentPage = "search";
      pageNum = 1;

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      closePlayer();
      loadContent();
    }

    document.getElementById("searchInput").addEventListener("keyup", (e) => {
      if (e.key === "Enter") doSearch();
    });

    // ================= RENDER =================
    function renderGrid(items, append = false) {
      const grid = document.getElementById("grid");
      if (!append) grid.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<img src="${item.video_image}" loading="lazy" alt="">`;
        card.onclick = () => openPlayer(item);
        grid.appendChild(card);
      });
    }

    // ================= PLAYER =================
    async function openPlayer(item) {
      currentPlaying = item;
      setStatus("Loading video...");

      try {
        const res = await fetch(WORKER_URL + "/video?url=" + encodeURIComponent(item.detail_url));
        const json = await res.json();
        if (json.status !== "success") throw new Error(json.message);

        const proxyUrl = WORKER_URL + "/proxy?url=" + encodeURIComponent(json.video_url);

        const player = document.getElementById("player");
        player.src = proxyUrl;
        player.load();
        player.play().catch(() => {});

        // Update tombol Saved
        const saved = getSaved();
        const isSaved = saved.some(v => v.detail_url === item.detail_url);
        const btnSaved = document.getElementById("btnSaved");
        btnSaved.textContent = isSaved ? "✓ Saved" : "Saved";
        btnSaved.classList.toggle("saved", isSaved);

        // Tombol Download
        document.getElementById("btnDownload").onclick = () => {
          window.open(json.video_url, "_blank");
        };

        // Tombol Share
        document.getElementById("btnShare").onclick = () => {
          if (navigator.share) {
            navigator.share({
              title: "Check this video",
              url: json.video_url
            });
          } else {
            navigator.clipboard.writeText(json.video_url);
            alert("Link copied!");
          }
        };

        // Tombol Saved
        btnSaved.onclick = () => {
          let list = getSaved();
          const exists = list.findIndex(v => v.detail_url === item.detail_url);
          if (exists >= 0) {
            list.splice(exists, 1);
            btnSaved.textContent = "Saved";
            btnSaved.classList.remove("saved");
          } else {
            list.unshift(item);
            btnSaved.textContent = "✓ Saved";
            btnSaved.classList.add("saved");
          }
          saveToStorage(list);
        };

        // Related (sementara pakai currentItems)
        const relatedGrid = document.getElementById("relatedGrid");
        relatedGrid.innerHTML = "";
        currentItems.filter(v => v.detail_url !== item.detail_url).slice(0, 12).forEach(rel => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `<img src="${rel.video_image}" loading="lazy">`;
          card.onclick = () => openPlayer(rel);
          relatedGrid.appendChild(card);
        });

        // Ganti tampilan
        document.getElementById("grid-view").classList.add("hidden");
        document.getElementById("player-view").classList.add("active");
        hideStatus();
        window.scrollTo(0, 0);

      } catch (err) {
        setStatus("Gagal memuat video: " + err.message, true);
      }
    }

    function closePlayer() {
      const player = document.getElementById("player");
      player.pause();
      player.removeAttribute("src");
      document.getElementById("player-view").classList.remove("active");
      document.getElementById("grid-view").classList.remove("hidden");
    }

    // ================= INIT =================
    loadContent();
  </script>
</body>
</html>
